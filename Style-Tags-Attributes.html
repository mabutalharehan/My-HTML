<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .uber-button {

            background-color: black;
            color: white;
            border: none;
            height: 50px;
            width: 110px;
            cursor: pointer;


        }

        .amazon {

            background-color: rgb(255, 216, 20);
            color: black;
            border: none;
            height: 40px;
            width: 150px;
            font-weight: 550;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;

        }

        .github-button {
            background-color: rgb(46, 164, 79);
            color: white;
            border: none;
            height: 45px;
            width: 100px;
            font-weight: 600;
            font-size: 15px;
            border-radius: 7px;
            cursor: pointer;
            margin-top: 20px;
            ;
        }

        .get-started-button {
            background-color: rgb(121, 82, 179);
            color: white;
            border: none;
            height: 40px;
            width: 110px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 6px;
            margin-top: 20px;
        }

        .download-button {
            background-color: white;
            color: rgb(108, 117, 125);
            border-width: 1px;
            border-style: solid;
            border-color: rgb(108, 117, 125);
            height: 40px;
            width: 100px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
    <b>
        <button class="uber-button">Request Now</button> <br>
        <button class="amazon">Add to Cart</button> <br>
        <button class="github-button">Sign up</button> <br>
        <button class="get-started-button">Get started</button>
        <button class="download-button">Download</button>
    </b>

</body>

</html>
