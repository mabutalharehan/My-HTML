<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .uber-button {

            background-color: black;
            color: white;
            border: none;
            height: 50px;
            width: 110px;
            cursor: pointer;


        }

        .uber-button:hover {
            opacity: 0.8;
        }

        .amazon {

            background-color: rgb(255, 216, 20);
            color: black;
            border: none;
            height: 40px;
            width: 150px;
            font-weight: 550;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;

        }

        .amazon:hover {
            background-color: rgb(245, 205, 3);
        }

        .github-button {
            background-color: rgb(46, 164, 79);
            color: white;
            border: none;
            height: 45px;
            width: 100px;
            font-weight: 600;
            font-size: 15px;
            border-radius: 7px;
            cursor: pointer;
            margin-top: 20px;
            ;
        }

        .github-button:hover {
            box-shadow: 0px 5px 8px rgba(0, 0, 0, 0.15);
        }

        .get-started-button {
            background-color: rgb(121, 82, 179);
            color: white;
            border: none;
            height: 40px;
            width: 110px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 6px;
            margin-top: 20px;
        }

        .get-started-button:hover {
            background-color: rgb(99, 60, 156);
        }


        .download-button {
            background-color: white;
            color: rgb(108, 117, 125);
            border-width: 1px;
            border-style: solid;
            border-color: rgb(108, 117, 125);
            height: 40px;
            width: 100px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .download-button:hover {
            background-color: rgb(108, 117, 125);
            color: white;
        }

        .apply-button {
            background-color: rgb(10, 102, 194);
            color: white;
            border: none;
            height: 40px;
            width: 240px;
            font-weight: bold;
            font-size: 15px;
            border-radius: 20px;
            cursor: pointer;
            margin-right: 8px;
            margin-top: 20px;
        }

        .apply-button:hover {
            background-color: rgb(2, 70, 138);
        }

        .save-button {
            background-color: white;
            color: rgb(10, 102, 194);
            border-width: 1px;
            border-style: solid;
            border-color: rgb(10, 102, 194);
            height: 40px;
            width: 80px;
            font-weight: bold;
            font-size: 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        .save-button:hover {
            background-color: rgb(226, 240, 254);
            border-width: 2px;
        }
    </style>
    <b>
        <button class="uber-button">Request Now</button> <br>
        <button class="amazon">Add to Cart</button> <br>
        <button class="github-button">Sign up</button> <br>
        <button class="get-started-button">Get started</button>
        <button class="download-button">Download</button><br>
        <button class="apply-button">Apply on company website</button>
        <button class="save-button">Save</button>
    </b>

</body>

</html>
